<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>לוח השנה בן שמן תשפ״ז</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Assistant:wght@400;600;700&display=swap">
<style>
/* layout: one narrow column like the printed posters – topic sections, each row = date stamp, event, calendar button */
:root{
  --bg:#f3f6ef; --paper:#ffffff; --row:#e8f0e1; --ink:#1d2a1c; --muted:#5d6e5a;
  --leaf:#2f7a32; --leaf-ink:#ffffff; --line:#cfdcc7;
  --display:"Frank Ruhl Libre",Georgia,"Times New Roman",serif;
  --body:"Assistant","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121a12; --paper:#18221a; --row:#1f2d20; --ink:#e7efe3; --muted:#9db29a;
  --leaf:#6cc06f; --leaf-ink:#0e170e; --line:#2c3d2d; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding:0 16px}
.wrap{max-width:660px;margin:0 auto;padding-block:28px 40px;display:flex;flex-direction:column;gap:18px}
header{text-align:center;display:flex;flex-direction:column;gap:4px}
.school{font-size:.9rem;color:var(--muted)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(2rem,8vw,2.8rem);margin:0;color:var(--leaf);line-height:1.05;text-wrap:balance}
h1 small{display:block;font-size:.5em;color:var(--ink);font-weight:700;margin-top:6px}
.panel{display:flex;flex-direction:column;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px}
.modes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.modes span{font-weight:600;font-size:.9rem;color:var(--muted)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{font:inherit;font-size:.88rem;border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 11px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf);font-weight:700}
a:focus-visible,button:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.all{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:var(--leaf);color:var(--leaf-ink);border-radius:12px;padding:12px;font-weight:700;font-size:1.05rem}
.all svg{width:22px;height:22px}
.hint{font-size:.82rem;color:var(--muted);margin:0}
section{display:flex;flex-direction:column;gap:6px}
.sh{display:flex;align-items:center;gap:10px;padding-block:14px 4px;border-bottom:2px solid var(--leaf);margin-bottom:4px}
.sh .ico{width:38px;height:38px;border-radius:50%;background:var(--row);color:var(--leaf);display:grid;place-items:center;flex:none}
.sh .ico svg{width:22px;height:22px}
.sh h2{font-family:var(--display);font-weight:700;font-size:1.45rem;margin:0;flex:1;min-width:0}
.sh a{font-size:.8rem;font-weight:700;color:var(--leaf);text-decoration:none;border:1px solid var(--leaf);border-radius:999px;padding:4px 10px;white-space:nowrap}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{display:grid;grid-template-columns:5.2rem 1fr auto;gap:12px;align-items:center;background:var(--row);border-radius:10px;padding:10px 12px}
li.past{opacity:.5}
.date{display:flex;flex-direction:column;align-items:center;border-left:1px solid var(--line);padding-left:10px;font-variant-numeric:tabular-nums}
.date b{font-size:1.2rem;font-weight:700;text-align:center}
.date span{font-size:.75rem;color:var(--muted);white-space:pre-line;text-align:center}
.what{min-width:0}
.what .t{font-weight:700;font-size:1.03rem}
.what .n{font-size:.82rem;color:var(--muted)}
.cals{display:flex;flex-direction:column;gap:4px}
.cal{display:inline-flex;align-items:center;gap:4px;justify-content:center;text-decoration:none;color:var(--leaf-ink);background:var(--leaf);border-radius:8px;padding:7px 9px;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums}
.cal svg{width:20px;height:20px;flex:none}
.cal .lbl{direction:ltr}
footer{text-align:center;font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--leaf);padding-top:10px}
@media (max-width:420px){li{grid-template-columns:4.3rem 1fr auto;gap:8px;padding:9px 10px}.date b{font-size:1.05rem}.sh h2{font-size:1.25rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="school">בית חינוך ממלכתי קהילתי ״בן שמן״</div>
    <h1>Save the Date<small>לוח האירועים לשנת תשפ״ז</small></h1>
  </header>

  <div class="panel">
    <div class="modes">
      <span id="calLbl">היומן שלי:</span>
      <div class="seg" role="group" aria-labelledby="calLbl">
        <button type="button" data-m="google">Google / אנדרואיד</button>
        <button type="button" data-m="apple">אייפון / מק</button>
        <button type="button" data-m="outlook">Outlook</button>
      </div>
    </div>
    <a class="all" id="all" href="#"></a>
    <p class="hint">לחיצה על אייקון היומן ליד אירוע מוסיפה אותו בלבד. האירועים נשמרים כאירועי יום שלם (מפגשי ההורים בשעה 20:00) ומסומנים "פנוי", כך שלא יתנגשו באירועים אחרים ביומן.</p>
  </div>

  <div id="sections"></div>

  <footer>״בן שמן״ זה הבית שלי</footer>
</div>

<script>
const SCH="בית חינוך בן שמן";
const ICONS={
  school:'<path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-5h6v5M12 5V2.5h3"/>',
  trip:'<rect x="6" y="7" width="12" height="14" rx="3"/><path d="M9 7V5a3 3 0 0 1 6 0v2M6 13h12M10 13v2h4v-2"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
  masks:'<path d="M4 4h9v6a4.5 4.5 0 0 1-9 0z"/><path d="M11 10h9v6a4.5 4.5 0 0 1-9 0"/><path d="M6.5 8h.01M10.5 8h.01M14 14h.01M17.5 14h.01M6.5 11.5c.8.8 2.2.8 3 0"/>',
  people:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c.6-.3 1.3-.5 2-.5 2.5 0 4.5 2 4.5 4.5"/>',
  health:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M12 9.5v5M9.5 12h5"/>'
};
const CAL_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M12 12.5v5M9.5 15h5"/></svg>';
const SECTIONS=[{"id": "school", "title": "אירועי בית החינוך", "icon": "school", "ev": [["טקס שבעה באוקטובר", "באחריות צוות חינוכי ותלמידי שכבה ו׳", ["2026-10-07"]], ["ערב למידה להורי שכבה א׳", "", ["2026-10-21"]], ["יום הליכה בינלאומי", "", ["2026-10-29"]], ["טקס זיכרון יצחק רבין", "באחריות הפרלמנט הצעיר ובנות שכבה ה׳", ["2026-11-02"]], ["יום הורים מחצית א׳", "", ["2026-11-29", "2026-12-01"]], ["טקס חנוכה", "באחריות שכבה ג׳", ["2026-12-03"]], ["סיום מחצית", "באחריות קורס ריקוד וקורס תיאטרון", ["2027-01-21"]], ["פעילות יום המשפחה – יום קריירה", "", ["2027-02-04"]], ["הפנינג פורים", "", ["2027-03-21"]], ["יום הורים מחצית ב׳", "", ["2027-03-28", "2027-03-30"]], ["טקס פסח וסדר פסח", "באחריות שכבה ד׳", ["2027-04-08"]], ["טקס יום השואה וחדר זיכרון", "באחריות שכבה ה׳", ["2027-05-04"]], ["טקס יום הזיכרון לחללי צה״ל ולנפגעי פעולות האיבה", "באחריות שכבה ה׳", ["2027-05-11"]], ["ערב קהילתי", "", ["2027-05-23"]], ["טקס שבועות", "באחריות שכבות א׳–ב׳", ["2027-06-08"]], ["מסיבת סיום שכבות א׳–ה׳", "", ["2027-06-23"]], ["מופע סיום ו׳", "", ["2027-06-28"]]]}, {"id": "parents", "title": "מפגשי הורים", "icon": "people", "ev": [["מפגש ראשון עם מועצת ההורים", "לתכנון המפגשים ולבניית הדרך המשותפת", ["2026-10-13"], "20:00"], ["מפגש הורים", "פתוח לכלל קהילת ההורים", ["2026-11-09"], "20:00"], ["מפגש הורים", "פתוח לכלל קהילת ההורים", ["2026-12-14"], "20:00"], ["מפגש הורים", "פתוח לכלל קהילת ההורים", ["2027-01-11"], "20:00"], ["מפגש הורים", "פתוח לכלל קהילת ההורים", ["2027-02-08"], "20:00"], ["מפגש הורים", "פתוח לכלל קהילת ההורים", ["2027-03-08"], "20:00"], ["מפגש הורים", "פתוח לכלל קהילת ההורים", ["2027-04-11"], "20:00"], ["מפגש הורים", "פתוח לכלל קהילת ההורים", ["2027-05-10"], "20:00"], ["מפגש הורים", "פתוח לכלל קהילת ההורים", ["2027-06-14"], "20:00"]]}, {"id": "trips", "title": "טיולים", "icon": "trip", "ev": [["טיול שנתי כוכב", "שכבות א׳–ו׳", ["2027-04-04"]], ["טיול שנתי", "שכבות ה׳–ו׳", ["2027-05-16"]]]}, {"id": "special", "title": "ימי שיא מיוחדים", "icon": "star", "ev": [["חידון התנ״ך", "שכבות ה׳–ו׳", ["2027-03-03"]], ["יום שיא שני קצוות החבל", "שכבה ה׳", ["2027-04-05"]]]}, {"id": "shows", "title": "הצגות ומופעים", "icon": "masks", "ev": [["הצגה ״צוות לעניין״", "שכבות ה׳–ו׳", ["2026-11-15"]], ["מופע בהפתעה – זה״ב", "שכבות א׳–ד׳", ["2026-11-19"]], ["הצגה", "שכבות ד׳–ו׳", ["2026-12-31"]], ["הצגה", "שכבות א׳–ג׳", ["2027-02-11"]], ["מופע מוזיקלי ישראלי", "שכבות א׳–ו׳", ["2027-05-20"]]]}, {"id": "health", "title": "בדיקות וחיסונים", "icon": "health", "ev": [["בדיקת שיניים", "שכבות א׳–ו׳", ["2026-10-20"]], ["חיסון שפעת", "שכבות ב׳–ד׳", ["2026-11-15"]], ["חיסון", "שכבה א׳", ["2027-01-03"]], ["חיסון", "שכבה ב׳", ["2027-01-05"]], ["בדיקת שמיעה", "שכבה א׳", ["2027-01-12"]]]}];
// events whose title alone is ambiguous get the grade in the calendar title
const titleFor=e=>(e[1]&&e[1].startsWith("שכב"))?e[0]+" – "+e[1]:e[0];
const tEnd=t=>{const[h,m]=t.split(":").map(Number);const x=h*60+m+90;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")};
const hm=t=>t.replace(":","")+"00";

const DAYS=["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"];
const fmt=d=>{const p=d.split("-").map(Number);return p[2]+"."+p[1]};
const ymd=d=>d.replace(/-/g,"");
const next=d=>{const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+1);return x.toISOString().slice(0,10)};
const dow=d=>"יום "+DAYS[new Date(d+"T12:00:00Z").getUTCDay()];
const ua=navigator.userAgent||"";
const isIOS=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
let mode=/iPhone|iPad|iPod|Macintosh/.test(ua)?"apple":"google";
try{const s=localStorage.getItem("calMode");if(s)mode=s}catch(e){}

// ---- ICS ----
const icsEsc=s=>s.replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
const enc=new TextEncoder();
function fold(line){
  const out=[];let cur="",len=0;
  for(const ch of line){const b=enc.encode(ch).length;if(len+b>(out.length?74:75)){out.push(cur);cur="";len=0}cur+=ch;len+=b}
  out.push(cur);return out.join("\r\n ");
}
function details(e,d){
  let s=SCH+(e[1]?" · "+e[1]:"");
  if(e[2].length>1)s+=" · מועד חלופי: "+e[2].filter(x=>x!==d).map(fmt).join(", ");
  return s;
}
function vevent(e,d,uid){
  return["BEGIN:VEVENT","UID:"+uid+"@benshemen-tashpaz","DTSTAMP:20261006T000000Z",
   "DTSTART;VALUE=DATE:"+ymd(d),"DTEND;VALUE=DATE:"+ymd(next(d)),
   "SUMMARY:"+icsEsc(titleFor(e)),"DESCRIPTION:"+icsEsc(details(e,d)),"LOCATION:"+icsEsc(SCH),
   "TRANSP:TRANSPARENT","X-MICROSOFT-CDO-BUSYSTATUS:FREE","END:VEVENT"];
}
function ics(items){
  let L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ben Shemen//Tashpaz//HE","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:בן שמן תשפ״ז"];
  items.forEach(([e,d,uid])=>{L=L.concat(vevent(e,d,uid))});
  L.push("END:VCALENDAR");
  return "data:text/calendar;charset=utf-8,"+encodeURIComponent(L.map(fold).join("\r\n")+"\r\n");
}
function setIcsLink(a,path){a.href=path;a.removeAttribute("target");a.removeAttribute("download")}
function setEventLink(a,e,d,uid){
  const t=titleFor(e),det=details(e,d);
  const tm=e[3];
  if(mode==="google"){a.href="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(t)+"&dates="+(tm?ymd(d)+"T"+hm(tm)+"/"+ymd(d)+"T"+hm(tEnd(tm)):ymd(d)+"/"+ymd(next(d)))+"&details="+encodeURIComponent(det)+"&location="+encodeURIComponent(SCH)+"&ctz=Asia/Jerusalem&trp=false";}
  else if(mode==="outlook"){a.href="https://outlook.live.com/calendar/0/action/compose?subject="+encodeURIComponent(t)+(tm?"&startdt="+d+"T"+tm+":00&enddt="+d+"T"+tEnd(tm)+":00":"&startdt="+d+"&enddt="+next(d)+"&allday=true")+"&body="+encodeURIComponent(det)+"&location="+encodeURIComponent(SCH);}
  else{setIcsLink(a,""+uid+".ics");return}
  a.removeAttribute("download");a.target="_blank";a.rel="noopener";
}

const today=new Date().toISOString().slice(0,10);
function allItems(sec){const r=[];sec.ev.forEach((e,i)=>e[2].forEach((d,j)=>r.push([e,d,sec.id+i+"-"+j])));return r}

function render(){
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===mode));
  const every=SECTIONS.flatMap(allItems);
  const all=document.getElementById("all");
  all.innerHTML=CAL_ICON+"הוסף הכל ליומן ("+SECTIONS.reduce((n,s)=>n+s.ev.length,0)+" אירועים)";
  setIcsLink(all,"all.ics");
  const root=document.getElementById("sections");root.innerHTML="";
  SECTIONS.forEach(sec=>{
    const s=document.createElement("section");
    s.innerHTML='<div class="sh"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[sec.icon]+'</svg></span><h2></h2><a></a></div><ol></ol>';
    s.querySelector("h2").textContent=sec.title;
    const sa=s.querySelector(".sh a");sa.textContent="הוסף הכל";
    sa.setAttribute("aria-label","הוספת כל "+sec.title+" ליומן");
    setIcsLink(sa,""+sec.id+".ics");
    const ol=s.querySelector("ol");
    sec.ev.forEach((e,i)=>{
      const li=document.createElement("li");
      if(e[2].every(d=>d<today))li.className="past";
      li.innerHTML='<div class="date"><b></b><span></span></div><div class="what"><div class="t"></div>'+(e[1]?'<div class="n"></div>':'')+'</div><div class="cals"></div>';
      li.querySelector(".date b").textContent=e[2].map(fmt).join(" או ");
      li.querySelector(".date span").textContent=e[2].map(dow).join("\n")+(e[3]?"\n"+e[3]:"");
      li.querySelector(".t").textContent=e[0];
      if(e[1])li.querySelector(".n").textContent=e[1].startsWith("באחריות")?"("+e[1]+")":e[1];
      const c=li.querySelector(".cals");
      e[2].forEach((d,j)=>{
        const a=document.createElement("a");a.className="cal";
        a.setAttribute("aria-label","הוספה ליומן: "+e[0]+" "+fmt(d));
        a.innerHTML=CAL_ICON+(e[2].length>1?'<span class="lbl"></span>':'');
        if(e[2].length>1)a.querySelector(".lbl").textContent=fmt(d);
        setEventLink(a,e,d,sec.id+i+"-"+j);
        c.appendChild(a);
      });
      ol.appendChild(li);
    });
    root.appendChild(s);
  });
}
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.m;try{localStorage.setItem("calMode",mode)}catch(e){}render()}));
render();
</script>
</body>
</html>
